services:
  postgres:
    # Match prod's major version. To see prod's version, run
    # `SELECT version();` on console.neon.tech.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: open_minutes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker and
      # expect the volume mounted one level up.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_minutes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
