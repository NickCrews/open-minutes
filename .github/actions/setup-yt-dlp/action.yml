# Everything the pipeline needs to talk to YouTube: ffmpeg, yt-dlp, a JS
# runtime for yt-dlp to solve YouTube's player challenges, and cookies to get
# past the "sign in to confirm you're not a bot" wall YouTube puts in front of
# datacenter IPs like GitHub's runners.
name: Set up yt-dlp
description: Install ffmpeg, deno and yt-dlp, and hand yt-dlp YouTube cookies

inputs:
  cookies:
    description: >-
      Contents of a Netscape-format cookies.txt from a browser signed in to
      YouTube (pass secrets.YOUTUBE_COOKIES). Without it, downloads from YouTube
      fail on the bot check.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg

    # yt-dlp only uses deno out of the box for YouTube's JS challenges;
    # without one, some formats are missing.
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # [default] pulls in yt-dlp-ejs, the challenge solver scripts deno runs.
    - name: Install yt-dlp
      shell: bash
      run: pipx install "yt-dlp[default]"

    - name: Hand yt-dlp the YouTube cookies
      shell: bash
      env:
        COOKIES: ${{ inputs.cookies }}
      run: |
        if [ -z "$COOKIES" ]; then
          echo "::warning::No YOUTUBE_COOKIES secret, so downloads from YouTube will fail its bot check (and the tests that need them are skipped)."
          exit 0
        fi
        # yt-dlp rewrites this file as cookies rotate, so it must be writable.
        file="$RUNNER_TEMP/youtube-cookies.txt"
        printf '%s\n' "$COOKIES" > "$file"
        chmod 600 "$file"
        echo "YOUTUBE_COOKIES=$file" >> "$GITHUB_ENV"
