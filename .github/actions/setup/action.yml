# What nearly every job needs after checkout: Vite+, the Node and pnpm versions
# package.json's devEngines pins, and the workspace's dependencies, installed
# exactly as the lockfile says.
name: Set up the workspace
description: Install Vite+, Node and pnpm, then the workspace's dependencies

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        cache: true
        run-install: |
          - args: ['--frozen-lockfile']
