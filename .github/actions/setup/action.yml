# What nearly every job needs after checkout: pnpm, Node, and the workspace's
# dependencies, installed exactly as the lockfile says.
name: Set up the workspace
description: Install pnpm and Node, then the workspace's dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
