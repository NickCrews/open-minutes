# Deploys a commit on main to production, then fast-forwards the `production`
# branch to it, so `production` is always what is live. See
# docs/contributing/deploy.md.
#
# Two triggers, both restricted to the repo owner by user id (which survives a
# username change):
#   - Running this workflow from the Actions tab, or with
#     `gh workflow run production.yml -f ref=<ref>`, deploys a branch, tag or
#     SHA (default main).
#   - Commenting `/deploy` on a merged PR deploys its merge commit, and replies
#     with the result.
#
# Production only moves forward along main: the target must be on main, and a
# commit production already has is a no-op, not a rollback. We only roll
# forward: to undo a bad deploy, fix or revert on main and deploy that.
#
# issue_comment and workflow_dispatch run the workflow file from the default
# branch, so a PR can't change what `/deploy` does before it's merged.
name: production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (must be on main)
        required: true
        default: main
  issue_comment:
    types: [created]

concurrency:
  group: production
  # Never cancel: a deploy cancelled between migrating and switching traffic
  # would leave production migrated but serving the previous version.
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # 10820686 is NickCrews.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor_id == '10820686')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.id == 10820686
          && startsWith(github.event.comment.body, '/deploy'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://open-minutes.nickcrews.workers.dev/
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      # For a comment: acknowledge it, and find the PR's merge commit.
      - name: Resolve what to deploy
        id: target
        uses: actions/github-script@v7
        env:
          INPUT_REF: ${{ inputs.ref }}
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("ref", process.env.INPUT_REF);
              return;
            }
            // startsWith('/deploy') above also matches "/deployment notes".
            if (context.payload.comment.body.trim() !== "/deploy") {
              core.setOutput("skip", "true");
              return;
            }
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (!pr.merged) {
              const error = `#${pr.number} isn't merged. Merge it, then comment \`/deploy\` again.`;
              core.setOutput("error", error);
              core.setFailed(error);
              return;
            }
            core.setOutput("ref", pr.merge_commit_sha);

      - uses: actions/checkout@v4
        if: steps.target.outputs.ref != ''
        with:
          # Full history, to check the target is on main and ahead of production.
          fetch-depth: 0
          # The build runs third-party code; only the final push gets the token.
          persist-credentials: false

      - name: Check the target
        id: check
        if: steps.target.outputs.ref != ''
        env:
          REF: ${{ steps.target.outputs.ref }}
        run: |
          fail() { echo "error=$1" >> "$GITHUB_OUTPUT"; echo "::error::$1"; exit 1; }

          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" \
             || git rev-parse --verify --quiet "$REF^{commit}") \
            || fail "\`$REF\` isn't a branch, tag or commit in this repo."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          git merge-base --is-ancestor "$sha" origin/main \
            || fail "\`${sha:0:7}\` isn't on main. Only commits on main can be deployed."

          if old=$(git rev-parse --verify --quiet origin/production); then
            echo "old=$old" >> "$GITHUB_OUTPUT"
            if git merge-base --is-ancestor "$sha" "$old"; then
              echo "Production (${old:0:7}) already includes ${sha:0:7}; nothing to do."
              exit 0
            fi
            git merge-base --is-ancestor "$old" "$sha" \
              || fail "Production (\`${old:0:7}\`) has commits that \`${sha:0:7}\` doesn't, so this isn't a fast-forward."
          fi
          git checkout --quiet "$sha"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        if: steps.check.outputs.go == 'true'

      - name: Build
        if: steps.check.outputs.go == 'true'
        run: pnpm --filter @open-minutes/web build

      # Uploads the new Worker version with no traffic, migrates production,
      # switches traffic. See packages/web/scripts/deploy-built.sh.
      - name: Deploy
        if: steps.check.outputs.go == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: pnpm --filter @open-minutes/web run deploy:built

      # No --force: GitHub rejects anything but a fast-forward too.
      - name: Move production
        if: steps.check.outputs.go == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$SHA:refs/heads/production"

      # Answers the `/deploy` comment, and summarizes the run.
      - name: Report
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          ERROR: ${{ steps.target.outputs.error || steps.check.outputs.error }}
          SHA: ${{ steps.check.outputs.sha }}
          OLD: ${{ steps.check.outputs.old }}
          GO: ${{ steps.check.outputs.go }}
          FAILED: ${{ job.status == 'failure' }}
        with:
          script: |
            const { ERROR, SHA, OLD, GO, FAILED } = process.env;
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const commit = (s) => `[\`${s.slice(0, 7)}\`](${repoUrl}/commit/${s})`;
            const change = () =>
              OLD
                ? `${commit(OLD)} → ${commit(SHA)} ([changes](${repoUrl}/compare/${OLD}...${SHA}))`
                : commit(SHA);

            let body;
            if (ERROR) {
              body = `❌ Not deployed: ${ERROR}`;
            } else if (FAILED === "true") {
              body =
                `❌ The deploy failed. [The run](${runUrl}) says how far it got; ` +
                `re-run it to retry.`;
            } else if (GO !== "true") {
              body = `Production (${commit(OLD)}) already includes ${commit(SHA)}. Nothing to do.`;
            } else {
              body =
                `🚀 Deployed to [production](https://open-minutes.nickcrews.workers.dev/): ` +
                `${change()}.`;
            }
            body += `\n\n<sub>[run](${runUrl})</sub>`;

            await core.summary.addRaw(body).write();
            if (context.eventName === "issue_comment") {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
