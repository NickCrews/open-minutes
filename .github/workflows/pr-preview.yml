# A live preview of the web app per pull request: its own Cloudflare Worker
# (open-minutes-pr-N, served at https://open-minutes-pr-N.<account>.workers.dev)
# backed by its own Neon branch (preview/pr-N), a copy-on-write fork of
# production migrated to the PR's schema. That also proves the PR's migrations
# apply to real production data (and that the PR has main's migrations) before
# merge. Both are deleted when the PR closes; the Neon branch also expires on
# its own after 14 days.
#
# Opt-in: does nothing until the repo has
#   secret   NEON_API_KEY           (a project-scoped Neon API key)
#   secret   CLOUDFLARE_API_TOKEN   (Account > Workers Scripts > Edit)
#   variable NEON_PROJECT_ID
#   variable CLOUDFLARE_ACCOUNT_ID
# and the Cloudflare account has a workers.dev subdomain registered.
#
# Skipped for PRs from forks: they get no secrets.
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  # Queue rather than cancel: a cancelled deploy is harmless, but a cancelled
  # cleanup would leak the Worker and the Neon branch.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  NEON_BRANCH: preview/pr-${{ github.event.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: open-minutes-pr-${{ github.event.number }}
  WRANGLER_SEND_METRICS: "false"
  COMMENT_MARKER: "<!-- pr-preview -->"

jobs:
  deploy:
    if: >-
      vars.NEON_PROJECT_ID != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Compute the Neon branch's expiry
        id: expiry
        run: echo "at=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Returns the existing branch on later pushes (its expiry is set only at
      # creation).
      - name: Create (or reuse) the PR's Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
          expires_at: ${{ steps.expiry.outputs.at }}

      # The branch persists across pushes, so data reviewers enter survives and
      # each push only applies its new migrations. But editing or regenerating
      # a migration the branch already has leaves its history diverged, which
      # deploy mode rightly refuses to touch. The branch is disposable, so start
      # it over from production (same URLs, so the Worker's secret stays
      # valid). If production itself has migrations this PR lacks, it still
      # diverges after the reset, and the migrate below fails with "merge the
      # base branch into yours".
      - name: Check whether the branch diverged from this PR's migrations
        id: diverged
        env:
          DB_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          echo "::add-mask::$DB_URL"
          if pnpm -s db status --db "$DB_URL" --json | jq -e '.diverged' > /dev/null; then
            echo "Preview branch diverged from this PR's migrations; resetting it from production."
            echo "diverged=true" >> "$GITHUB_OUTPUT"
          else
            echo "diverged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset the branch from production
        if: steps.diverged.outputs.diverged == 'true'
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}
          parent: true

      - name: Migrate the branch
        env:
          DB_URL: ${{ steps.branch.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.branch.outputs.db_url_pooled }}
        run: |
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$DB_URL_POOLED"
          pnpm db migrate --db "$DB_URL"
          pnpm db status --db "$DB_URL" --check
          # Hand the pooled URL (what the Worker uses) to the deploy step as a
          # file, so it isn't repeated in another step's environment.
          jq -n --arg url "$DB_URL_POOLED" '{DATABASE_URL: $url}' > "$RUNNER_TEMP/worker-secrets.json"

      # The build never touches a database: vite.config.ts only resolves one
      # for the dev server, so dist/server/wrangler.json has no vars.
      - name: Build
        env:
          # Baked into the client, which plays excerpts' audio from the store.
          OBJECT_STORE_PUBLIC_URL: ${{ vars.OBJECT_STORE_PUBLIC_URL }}
        run: pnpm --filter @open-minutes/web build

      - name: Deploy the preview Worker
        id: deploy
        working-directory: packages/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          # --name overrides the name in the vite plugin's generated
          # dist/server/wrangler.json. --secrets-file uploads DATABASE_URL as a
          # secret_text binding in the same request as the code, so there is
          # no window where the Worker runs without it.
          pnpm exec wrangler deploy \
            --name "$WORKER_NAME" \
            --secrets-file "$RUNNER_TEMP/worker-secrets.json" \
            --message "PR #${{ github.event.number }} @ ${{ github.event.pull_request.head.sha }}"
          rm -f "$RUNNER_TEMP/worker-secrets.json"
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev"))' \
            "$WRANGLER_OUTPUT_FILE_PATH" | head -n1)
          if [ -z "$url" ]; then
            echo "::error::wrangler reported no workers.dev URL (is a workers.dev subdomain registered?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Deployed \`${process.env.HEAD_SHA.slice(0, 7)}\` as Worker \`${process.env.WORKER_NAME}\`, ` +
                `backed by Neon branch \`${process.env.NEON_BRANCH}\`. Torn down when this PR closes.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      vars.NEON_PROJECT_ID != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the preview Worker
        run: |
          # The API directly, so a Worker that's already gone (404) is success;
          # `wrangler delete` would fail on it. force=true: nothing binds to it.
          status=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME?force=true")
          case "$status" in
            200) echo "Deleted Worker $WORKER_NAME." ;;
            404) echo "No Worker $WORKER_NAME." ;;
            *) cat "$RUNNER_TEMP/resp.json"; echo "::error::Deleting $WORKER_NAME failed (HTTP $status)"; exit 1 ;;
          esac

      - name: Delete the Neon branch
        uses: neondatabase/delete-branch-action@v3
        # Fails if the branch is already gone (e.g. it expired, or no deploy
        # ever created it), which is fine.
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}

      - name: Mark the PR comment as torn down
        uses: actions/github-script@v7
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id,
                body: `${marker}\n~~Preview~~ torn down: Worker \`${process.env.WORKER_NAME}\` and Neon branch \`${process.env.NEON_BRANCH}\` deleted.`,
              });
            }
