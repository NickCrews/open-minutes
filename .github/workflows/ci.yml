# The checks a contributor runs locally with `pnpm check`, plus a build of the
# web app. Slow (SLOW=1) tests are not run here. Migration and schema checks
# live in db.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: typecheck, format, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pipx install yt-dlp

      # The pipeline downloads ~650MB of ONNX models on first use. The model
      # specs (URLs) live in these files, so a change to them busts the cache.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: packages/pipeline/src/models
          key: onnx-models-${{ hashFiles('packages/pipeline/src/model.ts', 'packages/pipeline/src/transcribe.ts', 'packages/pipeline/src/diarize.ts', 'packages/pipeline/src/embed.ts') }}

      # Postgres starts the way it does for a developer: the first test that
      # needs it finds nothing on localhost:5432 and runs `docker compose up`.
      - name: Test
        run: pnpm test

  build:
    name: build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build never touches a database (see pr-preview.yml).
      - name: Build
        run: pnpm --filter @open-minutes/web build
