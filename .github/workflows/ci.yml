# The checks a contributor runs locally with `pnpm check`, plus a build of the
# web app (built, not deployed). Each is its own job, so each shows up as its
# own check on a PR and one failing doesn't hide the others. Slow (SLOW=1)
# tests are not run here. Migration and schema checks live in db.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-yt-dlp
        with:
          cookies: ${{ secrets.YOUTUBE_COOKIES }}

      # The pipeline's ONNX models are ~650MB. Fetch them in their own step,
      # so no test pays for (or times out on) the download. The cache key is
      # the models' specs (URLs and files), so only a change to a model busts
      # it. Restore and save are separate so a cache miss is saved even when
      # the tests then fail.
      - name: Compute the models' cache key
        id: models
        run: |
          pnpm -s om models --list > "$RUNNER_TEMP/models.jsonl"
          echo "key=onnx-models-$(sha256sum < "$RUNNER_TEMP/models.jsonl" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the models
        id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/pipeline/src/models
          key: ${{ steps.models.outputs.key }}
      - name: Download the models
        run: pnpm om models
      - name: Save the models
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/pipeline/src/models
          key: ${{ steps.models.outputs.key }}

      # Postgres starts the way it does for a developer: the first test that
      # needs it finds nothing on localhost:5432 and runs `docker compose up`.
      - name: Test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build never touches a database (see pr-preview.yml).
      - name: Build
        run: pnpm --filter @open-minutes/web build
