# Is this code correct? The checks a contributor runs locally with
# `pnpm check`, a build of the web app (built, not deployed), and the database
# checks: schema and migrations agree, and migrations apply cleanly to an empty
# database. Each is its own job, so each shows up as its own check on a PR and
# one failing doesn't hide the others. Slow (SLOW=1) tests are not run here.
#
# Applying a PR's migrations to a copy of production is pr-preview.yml's job.
#
# Nothing here deploys; pr-preview.yml and production.yml do.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  test:
    name: tests
    runs-on: ubuntu-latest
    # Metadata and audio come from the blob store, and the pipeline decodes
    # the audio itself, so this job needs neither yt-dlp nor ffmpeg.
    # github.token may run the
    # fetch-youtube-audio workflow for anything missing from it and download
    # its artifacts (except on a fork's PR, whose token is always read-only).
    # This job has no blob store keys, so what it fetches isn't stored.
    permissions:
      contents: read
      actions: write
    env:
      BLOB_STORE_PUBLIC_URL: ${{ vars.OBJECT_STORE_PUBLIC_URL }}
      YOUTUBE_AUDIO_DISPATCH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The pipeline's ONNX models are ~650MB. Fetch them in their own step,
      # so no test pays for (or times out on) the download. The cache key is
      # the models' specs (URLs and files), so only a change to a model busts
      # it. Restore and save are separate so a cache miss is saved even when
      # the tests then fail.
      - name: Compute the models' cache key
        id: models
        run: |
          pnpm -s models --list > "$RUNNER_TEMP/models.jsonl"
          echo "key=onnx-models-$(sha256sum < "$RUNNER_TEMP/models.jsonl" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the models
        id: models-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/audio/src/models
          key: ${{ steps.models.outputs.key }}
      - name: Download the models
        run: pnpm models
      - name: Save the models
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages/audio/src/models
          key: ${{ steps.models.outputs.key }}

      # Postgres starts the way it does for a developer: the first test that
      # needs it finds nothing on localhost:5432 and runs `docker compose up`.
      - name: Test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The build never touches a database (see pr-preview.yml).
      - name: Build
        run: pnpm --filter @open-minutes/web build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Postgres comes up exactly the way it does for a developer: nothing
      # starts it explicitly. The first `pnpm db` command finds nothing listening on
      # localhost:5432 and runs `docker compose up` from docker-compose.yml.

      - name: Migrations have no conflicts
        run: pnpm db check

      - name: schema.ts and migrations are in sync
        run: |
          pnpm db generate < /dev/null
          if [ -n "$(git status --porcelain packages/db/src/migrations)" ]; then
            echo "::error::schema.ts has changes with no migration. Run \`pnpm db generate\` and commit the result."
            git status --porcelain packages/db/src/migrations
            exit 1
          fi

      - name: Build a fresh database the way `pnpm dev` does
        run: |
          pnpm db up
          pnpm db up        # the second run must be a no-op
          pnpm db status --check
          pnpm db wipe
          pnpm db migrate   # applies every migration to the wiped database
          pnpm db up --data bodies --data-reset if-needed
          pnpm db status --check
