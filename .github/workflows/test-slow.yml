# Runs the tests tagged `slow` (`pnpm test:slow`): transcribing and diarizing
# whole golden meetings and scoring the results, and a real
# fetch-youtube-audio run. Each test is its own job, so they run in parallel
# and each shows up on its own. The summary job collects every meeting's WER
# and real-time factor into one table on the run's page.
#
# Runs weekly on main, on PRs that touch the pipeline, and from the Actions
# tab on any branch.
name: test-slow

on:
  pull_request:
    paths:
      - packages/audio-ml/**
      - packages/codecs/**
      - packages/core/src/transcription/**
      - .github/workflows/test-slow.yml
      - .github/scripts/slow-test-matrix.mjs
      - .github/actions/get-models/**
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:

concurrency:
  group: test-slow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BLOB_STORE_PUBLIC_URL: ${{ vars.OBJECT_STORE_PUBLIC_URL }}

jobs:
  list:
    name: List the slow tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Collecting by running the test files (not parsing them) expands tests
      # made in loops, one per meeting. Tests skipped without SLOW=1 or a token
      # aren't listed, so both are set here; the token's value isn't used.
      - name: List
        id: list
        env:
          SLOW: "1"
          YOUTUBE_AUDIO_DISPATCH_TOKEN: unused
        run: |
          pnpm exec vp test list --staticParse=false --tagsFilter slow --json > "$RUNNER_TEMP/tests.json"
          echo "matrix=$(node .github/scripts/slow-test-matrix.mjs < "$RUNNER_TEMP/tests.json")" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # github.token runs the fetch-youtube-audio workflow, for workflow-fetch's
    # test and for any golden audio missing from the blob store.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/get-models

      - name: Test
        env:
          PROJECT: ${{ matrix.project }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
          YOUTUBE_AUDIO_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          pnpm test:slow --project "$PROJECT" "$FILE" -t "$PATTERN" 2>&1 | tee "$RUNNER_TEMP/out/test.log"

      # The log, and the transcripts the tests write to test-runs/ for
      # inspection.
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -d packages/audio-ml/test-runs ]; then
            find packages/audio-ml/test-runs -name '*.gen.*' -exec cp --parents {} "$RUNNER_TEMP/out/" \;
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-slow-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out

  summary:
    name: Summary
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-slow-*
          path: out
      # north-star.test.ts logs one line per meeting:
      # [slug] WER=0.0712 (sub=… del=… ins=… of N); p95 start=0.123s; RTF=0.041; …
      - name: Tabulate WER and real-time factor
        run: |
          {
            echo "## Transcription"
            echo
            echo "| Meeting | WER | p95 word-start error | Real-time factor |"
            echo "| --- | --- | --- | --- |"
            grep -rhoE '\[[^]]+\] WER=.*' out --include=test.log | sort -u \
              | sed -E 's/^\[([^]]+)\] WER=([0-9.]+).*p95 start=([0-9.]+s); RTF=([0-9.]+).*/| \1 | \2 | \3 | \4 |/'
          } >> "$GITHUB_STEP_SUMMARY"
