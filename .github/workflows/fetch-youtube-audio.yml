# Fetches what the pipeline needs from one YouTube video and publishes it as
# this run's artifacts, one unzipped file each, kept for a day:
#   info.json    yt-dlp's metadata (minus its stream URLs)
#   speech.webm  YouTube's Opus audio, re-encoded to 16 kHz mono Opus at
#                24 kbps (~11 MB per hour); see .github/scripts/encode-speech-audio.sh
# If every download attempt fails, the only artifact is error.json instead.
#
# Clients (fetchVideoViaWorkflow in packages/youtube/src/workflow-fetch.ts)
# dispatch this when a video is missing from the blob store, follow the run,
# download the artifacts, and store them in the blob store themselves if they
# have its keys. This workflow never touches the blob store, so it needs no
# secrets.
#
# Trigger it by hand with `gh workflow run fetch-youtube-audio.yml -f video_id=<id>`.
name: fetch-youtube-audio
run-name: fetch-youtube-audio ${{ inputs.video_id }}

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID (11 characters)
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - name: Check the video ID
        run: |
          if ! [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
            echo "::error::not a YouTube video ID: $VIDEO_ID"
            exit 1
          fi
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # WARP's and Tor's .deb files, so a run can skip `apt-get update`. The
      # key changes monthly to pick up new releases.
      - name: Name the .deb cache
        id: debs
        run: echo "key=youtube-egress-debs-v2-${{ runner.os }}-${{ runner.arch }}-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: debs-cache
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}
      - name: Install Cloudflare WARP and Tor
        run: packages/ytdlp/egress/install.sh "$RUNNER_TEMP/debs"
      # Saved right away rather than at the end of the job, so a failed
      # download doesn't lose it.
      - uses: actions/cache/save@v4
        if: steps.debs-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}

      # Installs yt-dlp too. YouTube always refuses a runner's own IP, so
      # direct isn't tried.
      - name: Download the audio and metadata
        env:
          YOUTUBE_EGRESS: warp,tor
          YOUTUBE_EGRESS_STATE: ${{ runner.temp }}/youtube-egress
        run: pnpm exec vpx .github/scripts/fetch-youtube-audio.ts "$VIDEO_ID" "$RUNNER_TEMP/audio/original.webm"
      # ffmpeg isn't on the ubuntu-latest image.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Re-encode the audio for speech
        run: .github/scripts/encode-speech-audio.sh "$RUNNER_TEMP/audio/original.webm" "$OUT/speech.webm"
      # The stream URLs in yt-dlp's info expire within hours and make up most
      # of it, so they're dropped.
      - name: Trim the metadata
        run: |
          jq 'del(.formats, .requested_formats, .requested_downloads, .thumbnails, .automatic_captions, .subtitles, .heatmap)' \
            "$RUNNER_TEMP/audio/original.info.json" > "$OUT/info.json"

      # Unzipped (archive: false takes one file, named after it), so clients
      # download the files as they are.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/info.json
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/speech.webm
          archive: false
          retention-days: 1

      - name: Describe the failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          error=$(cat "$RUNNER_TEMP/audio/logs/last-error.txt" 2>/dev/null || echo "see $RUN_URL")
          jq -n --arg id "$VIDEO_ID" --arg error "$error" --arg run "$RUN_URL" \
            '{video_id: $id, error: $error, run_url: $run}' > "$OUT/error.json"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          path: ${{ runner.temp }}/out/error.json
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: yt-dlp-logs
          path: ${{ runner.temp }}/audio/logs/
