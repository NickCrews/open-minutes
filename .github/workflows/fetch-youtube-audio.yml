# Fetches what the pipeline needs from one YouTube video and publishes it as
# this run's artifacts, one unzipped file each, kept for a day:
#   metadata.json  the video's RecordingMetadata, as metadataToJson writes it
#   speech.webm    YouTube's Opus audio, re-encoded to 16 kHz mono Opus at
#                  24 kbps (~11 MB per hour)
# `youtube fetch` runs youtube() from @open-minutes/youtube, the same code that
# fetches a video locally, so the files match what a local fetch gives.
# If every download attempt fails, the only artifact is error.json instead.
#
# youtube() (via fetchVideoViaWorkflow in packages/youtube/src/workflow-fetch.ts)
# dispatches this when YouTube refuses yt-dlp every route from where it runs,
# follows the run, and downloads the artifacts; storedYoutube stores them in
# the blob store if it has its keys. This workflow never touches the blob store, so it needs no
# secrets.
#
# Trigger it by hand with `gh workflow run fetch-youtube-audio.yml -f video_id=<id>`.
name: fetch-youtube-audio
run-name: fetch-youtube-audio ${{ inputs.video_id }}

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID (11 characters)
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - name: Check the video ID
        run: |
          if ! [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
            echo "::error::not a YouTube video ID: $VIDEO_ID"
            exit 1
          fi
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # WARP's and Tor's .deb files, so a run can skip `apt-get update`. The
      # key changes monthly to pick up new releases.
      - name: Name the .deb cache
        id: debs
        run: echo "key=youtube-egress-debs-v2-${{ runner.os }}-${{ runner.arch }}-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: debs-cache
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}

      # YouTube refuses a runner's own IP, so after one direct attempt (a few
      # seconds) this installs WARP and Tor, fetches through them, and stops
      # them. Installs yt-dlp too.
      - name: Fetch the metadata and audio
        env:
          YOUTUBE_EGRESS_STATE: ${{ runner.temp }}/youtube-egress
        run: pnpm exec youtube fetch "$VIDEO_ID" "$OUT" --debs "$RUNNER_TEMP/debs"
      # Saved even when the fetch failed, so the next run has the .debs. A run
      # that went direct downloaded none, and saves nothing.
      - uses: actions/cache/save@v4
        if: "!cancelled() && steps.debs-cache.outputs.cache-hit != 'true'"
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}

      # Unzipped (archive: false takes one file, named after it), so clients
      # download the files as they are.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/metadata.json
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/speech.webm
          archive: false
          retention-days: 1

      - name: Describe the failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          error=$(cat "$OUT/logs/last-error.txt" 2>/dev/null || echo "see $RUN_URL")
          jq -n --arg id "$VIDEO_ID" --arg error "$error" --arg run "$RUN_URL" \
            '{video_id: $id, error: $error, run_url: $run}' > "$OUT/error.json"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          path: ${{ runner.temp }}/out/error.json
          archive: false
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: yt-dlp-logs
          path: ${{ runner.temp }}/out/logs/
